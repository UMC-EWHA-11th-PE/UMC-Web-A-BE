# 테스트를 돌릴 때는 src/main/resources/application.yaml 대신 이 설정을 씁니다
spring:
  datasource:
    # 테스트 동안만 메모리에 만들어졌다 사라지는 DB. MODE=MySQL로 MySQL 문법에 맞춰 동작합니다
    url: jdbc:h2:mem:umc_movie;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 테스트마다 스키마를 새로 만들어 엔티티 매핑도 함께 검증합니다
      ddl-auto: create-drop
    open-in-view: false
jwt:
  # 없으면 JwtUtil이 값을 찾지 못해 테스트가 시작되지 않습니다 (HMAC 키라 32바이트 이상)
  secret: test-secret-for-context-loading-only
  access-expiration: 3600
