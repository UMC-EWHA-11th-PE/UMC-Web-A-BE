<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Movie API 테스트</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    h2 { margin-top: 0; font-size: 18px; }
    input { padding: 6px; width: 240px; }
    button { padding: 6px 12px; }
    pre { background: #f5f5f5; padding: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🎬 Movie API 테스트</h1>

  <section>
    <h2>닉네임 중복 확인</h2>
    <input id="nickname" placeholder="닉네임" />
    <button onclick="checkNickname()">확인</button>
    <pre id="nickname-result"></pre>
  </section>

  <section>
    <h2>이메일 중복 확인</h2>
    <input id="email" placeholder="이메일" />
    <button onclick="checkEmail()">확인</button>
    <pre id="email-result"></pre>
  </section>

  <section>
    <h2>회원 평점 목록 조회</h2>
    <input id="memberId" type="number" placeholder="회원 ID" />
    <button onclick="getRatings()">조회</button>
    <pre id="ratings-result"></pre>
  </section>

  <script>
    const BASE_URL = "http://localhost:3000";

    async function request(path, resultId) {
      const result = document.getElementById(resultId);
      try {
        const res = await fetch(BASE_URL + path);
        const data = await res.json();
        result.textContent = `${res.status}\n` + JSON.stringify(data, null, 2);
      } catch (e) {
        result.textContent = "요청 실패: " + e.message;
      }
    }

    function checkNickname() {
      const nickname = document.getElementById("nickname").value;
      request(`/members/nickname/${encodeURIComponent(nickname)}`, "nickname-result");
    }

    function checkEmail() {
      const email = document.getElementById("email").value;
      request(`/members/email/${encodeURIComponent(email)}`, "email-result");
    }

    function getRatings() {
      const memberId = document.getElementById("memberId").value;
      request(`/members/${memberId}/ratings`, "ratings-result");
    }
  </script>
</body>
</html>
